name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q bridgelib tests

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install and import wheel
        shell: pwsh
        run: |
          python -m venv .wheel-venv
          $wheel = (Get-ChildItem dist\*.whl).FullName
          .\.wheel-venv\Scripts\python.exe -m pip install $wheel
          .\.wheel-venv\Scripts\python.exe -c "import bridge; import bridgelib.gui; print('wheel import OK')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
